name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次还在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows：完整门禁（单元测试 + 本地服务端到端验收）
  windows:
    name: Windows · unit + verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy browser libraries into src/renderer/vendor
        run: npm run setup

      - name: Unit tests
        run: npm test

      - name: End-to-end server verification
        run: npm run verify

  # Ubuntu：只跑纯 Node 的单元测试，用来提前暴露跨平台路径问题。
  # 应用本身仍只面向 Windows（where.exe / taskkill / 盘符路径），但单元测试
  # 已经做到两边都通过，所以这里也作为必需检查。
  linux:
    name: Linux · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy browser libraries into src/renderer/vendor
        run: npm run setup

      - name: Unit tests
        run: npm test
