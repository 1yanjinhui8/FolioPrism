name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次还在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows：完整门禁（单元测试 + 本地服务端到端验收）
  windows:
    name: Windows · unit + verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # electron@44 没有 postinstall：二进制是在第一次 require('electron') 时才下载。
      # node --test 会并行跑多个测试文件，多个进程同时解压同一个 zip 会撞
      # "Cannot create a file when that file already exists (os error 183)"。
      # 所以先在单个进程里把它装好。
      - name: Preinstall Electron binary
        run: node node_modules/electron/install.js

      - name: Copy browser libraries into src/renderer/vendor
        run: npm run setup

      - name: Unit tests
        run: npm test

      - name: End-to-end server verification
        run: npm run verify

  # Ubuntu：只跑纯 Node 的单元测试，用来提前暴露跨平台路径问题。
  # 应用本身仍只面向 Windows（where.exe / taskkill / 盘符路径），但单元测试
  # 已经做到两边都通过，所以这里也作为必需检查。
  linux:
    name: Linux · unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 同上：并行测试会同时触发 electron 首次下载，先串行装好
      - name: Preinstall Electron binary
        run: node node_modules/electron/install.js

      - name: Copy browser libraries into src/renderer/vendor
        run: npm run setup

      - name: Unit tests
        run: npm test
