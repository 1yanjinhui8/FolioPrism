name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

# 同一分支的新提交取消上一次还在跑的构建
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Windows：完整门禁（单元测试 + 本地服务端到端验收）
  windows:
    name: Windows · unit + verify
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy browser libraries into src/renderer/vendor
        run: npm run setup

      - name: Unit tests
        run: npm test

      - name: End-to-end server verification
        run: npm run verify

  # Ubuntu：只跑纯 Node 的单元测试，顺便提前暴露跨平台路径问题。
  # 项目本身只面向 Windows（where.exe / taskkill / 盘符路径），部分用例在 Linux
  # 上会失败；所以这个任务只作提示，不拦截 PR。等跨平台适配真正做起来再收紧。
  linux:
    name: Linux · unit (advisory)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Copy browser libraries into src/renderer/vendor
        run: npm run setup

      - name: Unit tests
        run: npm test
